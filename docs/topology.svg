<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="title desc">
  <title id="title">Smart Content Delivery System network topology</title>
  <desc id="desc">Ryu is centred above Open vSwitch s1 and connects to it over OpenFlow 1.3. Two clients and two replica servers connect directly to s1. Client TCP traffic targets the virtual service at 10.0.0.100 port 8080 and crosses s1, not the Ryu controller.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4fa"/>
    </linearGradient>
    <linearGradient id="ctrl" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#15366c"/><stop offset="1" stop-color="#2358a3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="740" rx="24" fill="url(#bg)"/>
  <rect x="14" y="14" width="1172" height="712" rx="19" fill="none" stroke="#d8e3ef"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#152c49">
    <text x="54" y="55" fill="#315c86" font-size="14" font-weight="bold" letter-spacing="2">PROJECT 19  /  COMPUTER NETWORKS</text>
    <text x="54" y="103" font-size="36" font-weight="bold">Smart Content Delivery System</text>
    <text x="56" y="137" fill="#455f77" font-size="18">Two clients, one virtual service, two interchangeable content replicas.</text>

    <rect x="448" y="174" width="304" height="125" rx="19" fill="url(#ctrl)"/>
    <text x="600" y="203" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="1.4" fill="#d4e7ff">CONTROL PLANE</text>
    <text x="600" y="239" text-anchor="middle" font-size="28" font-weight="bold" fill="#fff">Ryu Controller</text>
    <text x="600" y="265" text-anchor="middle" font-size="16" fill="#fff">127.0.0.1:6653</text>
    <text x="600" y="285" text-anchor="middle" font-size="13" fill="#d4e7ff">Selects backends and installs rules</text>

    <path d="M600 299 V408" stroke="#285ba7" stroke-width="3.5" stroke-dasharray="8 7" fill="none"/>
    <rect x="529" y="341" width="142" height="30" rx="15" fill="#e2edfc" stroke="#c4d9f6"/>
    <text x="600" y="361" text-anchor="middle" font-size="14" font-weight="bold" fill="#1c5094">OpenFlow 1.3</text>

    <text x="54" y="276" fill="#0d645f" font-size="14" font-weight="bold" letter-spacing="1.6">CLIENT HOSTS</text>
    <text x="944" y="276" fill="#0d645f" font-size="14" font-weight="bold" letter-spacing="1.6">CONTENT REPLICAS</text>
    <g stroke="#25837a" stroke-width="4" fill="none">
      <path d="M253 347 H365 Q382 347 394 359 L438 429 H476"/>
      <path d="M253 531 H367 Q386 531 395 518 L439 469 H476"/>
      <path d="M724 429 H762 L806 359 Q818 347 835 347 H947"/>
      <path d="M724 469 H761 L805 518 Q814 531 833 531 H947"/>
    </g>

    <g fill="#fff" stroke="#bcdfdd" stroke-width="1.5">
      <rect x="52" y="304" width="201" height="88" rx="13"/>
      <rect x="52" y="487" width="201" height="88" rx="13"/>
      <rect x="947" y="304" width="201" height="88" rx="13"/>
      <rect x="947" y="487" width="201" height="88" rx="13"/>
    </g>
    <g font-size="22" font-weight="bold">
      <text x="72" y="340">client1</text><text x="72" y="523">client2</text>
      <text x="968" y="340">server1</text><text x="968" y="523">server2</text>
    </g>
    <g font-size="16" fill="#455f77">
      <text x="72" y="369">10.0.0.1</text><text x="72" y="552">10.0.0.2</text>
      <text x="968" y="369">10.0.0.10</text><text x="968" y="552">10.0.0.20</text>
    </g>
    <g fill="#0d645f" font-size="14" font-weight="bold" text-anchor="middle">
      <text x="318" y="332">100 Mbps · 5 ms</text>
      <text x="321" y="557">100 Mbps · 15 ms</text>
      <text x="879" y="332">30 Mbps · 2 ms</text>
      <text x="877" y="557">20 Mbps · 10 ms</text>
    </g>

    <rect x="476" y="407" width="248" height="84" rx="15" fill="#d9f1ec" stroke="#9acfc6" stroke-width="1.5"/>
    <text x="600" y="438" text-anchor="middle" font-size="16" font-weight="bold" fill="#12675e">DATA PLANE</text>
    <text x="600" y="467" text-anchor="middle" font-size="22" font-weight="bold">Open vSwitch s1</text>
    <rect x="447" y="511" width="306" height="38" rx="19" fill="#fff" stroke="#cbdae8"/>
    <text x="600" y="536" text-anchor="middle" font-size="15" font-weight="bold">Virtual service: 10.0.0.100:8080</text>

    <rect x="52" y="608" width="1096" height="81" rx="15" fill="#fff" stroke="#d4e2ed"/>
    <path d="M75 633 H112" stroke="#25837a" stroke-width="4"/>
    <text x="123" y="638" font-size="15" fill="#183e47">Mininet host links carry client requests and server responses.</text>
    <path d="M75 662 H112" stroke="#285ba7" stroke-width="3.5" stroke-dasharray="7 5"/>
    <text x="123" y="667" font-size="15" fill="#244978">The controller programs the switch; it is not in the TCP data path.</text>
  </g>
</svg>
